[package]
name = "anima-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
anima-core = { path = "../../packages/core-rust/crates/anima-core" }
anima-model-adapters = { path = "../../packages/core-rust/crates/anima-model-adapters" }
anima-memory = { path = "../../packages/core-rust/crates/anima-memory", features = ["locomo-eval"] }
anima-swarm = { path = "../../packages/core-rust/crates/anima-swarm" }
atomicwrites = "0.4.4"
async-trait = "0.1"
axum = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
fastembed = { version = "5.13.4", default-features = false, features = ["hf-hub-rustls-tls", "ort-download-binaries-rustls-tls"] }
futures = "0.3"
keyring = "4.1.6"
meval = "0.2"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "stream"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sqlx = { workspace = true }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["request-id", "timeout", "trace"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
utoipa = { version = "5.4.0", features = ["axum_extras"] }
utoipa-scalar = { version = "0.3", features = ["axum"] }
zeroize = "1.8"

[dev-dependencies]
http-body-util = "0.1"

[lints]
workspace = true
